name: Bug report
description: Report a problem with tbtop/cms
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not use this
        form for security vulnerabilities — see
        [SECURITY.md](https://github.com/DiVotek/tbtop-cms/blob/main/SECURITY.md)
        instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: cms-version
    attributes:
      label: tbtop/cms version
      placeholder: e.g. 0.5.2
    validations:
      required: true

  - type: input
    id: admin-version
    attributes:
      label: tbtop/admin version
      placeholder: e.g. 0.4.0
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: e.g. 12.3.0
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.4.1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or configuration
      description: >
        Log output, stack traces, or the relevant slice of `config/tbtop-cms.php`.
        This field is rendered as-is; no need to add a code fence.
      render: shell
    validations:
      required: false

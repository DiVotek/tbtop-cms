name: Feature request
description: Suggest an idea or improvement for tbtop/cms
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For substantial changes, opening an issue like this before submitting
        a PR helps avoid wasted work — see CONTRIBUTING.md.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What's missing or awkward today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

# Supersede an in-flight run when the same branch is pushed again. main is
# exempt: its runs are the record for merge commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check code style
        run: vendor/bin/pint --test

  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  blocks-types:
    name: Block types up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check generated block types are up to date
        run: composer types:blocks:check

  test:
    name: Test - PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        testbench: ['^11.0']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, fileinfo
          coverage: none

      - name: Constrain Testbench
        run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      # Let paratest size the pool. Pinning --processes=4 was tried and showed
      # no gain, but run-to-run variance on the runner is wide (65-85s for the
      # same commit), so treat that as inconclusive rather than as evidence.
      - name: Execute tests
        run: vendor/bin/pest --ci --parallel

  # The MySQL run of the suite, on PRs into main (release PRs) and pushes to
  # main only: on a PR into release/** it shows as Skipped. Locally the same
  # run is `composer test:mysql`.
  test-mysql:
    name: Test (MySQL)
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    # root: Laravel's parallel testing creates one testing_test_N database per worker.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: Constrain Testbench
        run: composer require "orchestra/testbench:^11.0" --dev --no-interaction --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Execute tests
        run: composer test:mysql -- --ci

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

  node:
    name: Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # @tbtop/admin is not published yet: build it from DiVotek/tbtop at ADMIN_SHA.
      - name: Build @tbtop/admin
        run: ./scripts/fetch-admin.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

  node-e2e:
    name: Node E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vite preview and better-sqlite3 run on Node.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build @tbtop/admin
        run: ./scripts/fetch-admin.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The workbench installs both packages from tarballs, as a host would.
      # A fresh pack has a new hash, so `setup` packs and then runs
      # `bun update` on the two tarballs; the other dependencies stay locked.
      - name: Pack @tbtop/cms and @tbtop/admin, install the workbench
        working-directory: packages/node/workbench
        run: bun run setup

      - name: Type check the workbench
        working-directory: packages/node/workbench
        run: bun run typecheck

      - name: Install Chromium
        working-directory: packages/node/workbench
        run: bunx playwright install --with-deps chromium

      - name: E2E (TanStack Start host)
        working-directory: packages/node/workbench
        run: bun run e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-e2e-traces
          path: packages/node/workbench/test-results
          retention-days: 7

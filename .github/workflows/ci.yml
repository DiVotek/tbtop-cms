name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
  # A manual run ignores the path filters and runs every job.
  workflow_dispatch:

permissions:
  contents: read

# Supersede an in-flight run when the same branch is pushed again. main is
# exempt: its runs are the record for merge commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which parts of the repo the change touches. Jobs skip when their part is
  # untouched. On a draft PR everything but Workflow lint skips: a draft gets
  # the triage review first, and the full run starts once it is marked ready
  # (or on a manual run). "CI ok" below is the one required check, so a skip
  # never leaves branch protection waiting.
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      php: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft != true && steps.filter.outputs.php == 'true') }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft != true && steps.filter.outputs.frontend == 'true') }}
      node: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft != true && steps.filter.outputs.node == 'true') }}
      workflows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4

      # A change to CI itself runs everything.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflows: &workflows
              - '.github/workflows/**'
            php:
              - *workflows
              - '**.php'
              - 'composer.json'
              # Not committed today; listed so a committed lock still runs PHP jobs.
              - 'composer.lock'
              - 'phpunit.xml.dist'
              - 'testbench.yaml'
              - 'phpstan.neon.dist'
              - 'phpstan-baseline.neon'
              - 'pint.json'
              - 'config/**'
              - 'database/**'
              - 'resources/views/**'
              - 'resources/lang/**'
              - 'workbench/**'
              - 'tests/**'
              # PHP tests compare these to what PHP generates.
              - 'resources/js/**/*.fixture.json'
              - 'resources/js/**/*.generated.ts'
            frontend:
              - *workflows
              - 'resources/js/**'
              - 'workbench/resources/js/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'test-setup.ts'
              - 'tsconfig*.json'
              - 'vite.config.*'
            node:
              - *workflows
              - 'packages/node/**'

  actionlint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # git-cliff builds CHANGELOG.md from commit subjects: on a push every new
  # commit needs a conventional subject, on a PR its title (the squash subject).
  commits:
    name: Commit format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$EVENT" in
          pull_request) bin/check-commits --subject "$TITLE" ;;
          push)
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              echo "new branch: nothing to compare"
            else
              bin/check-commits "$BEFORE..$AFTER"
            fi
            ;;
          *) echo "no new commits on $EVENT" ;;
          esac

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check code style
        run: vendor/bin/pint --test

  analyse:
    name: Analyse
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  blocks-types:
    name: Block types up to date
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check generated block types are up to date
        run: composer types:blocks:check

  # One combination: PHP 8.4 on Testbench 11 (Laravel 13).
  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, fileinfo
          coverage: none

      - name: Constrain Testbench
        run: composer require "orchestra/testbench:^11.0" --dev --no-interaction --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      # Let paratest size the pool. Pinning --processes=4 was tried and showed
      # no gain, but run-to-run variance on the runner is wide (65-85s for the
      # same commit), so treat that as inconclusive rather than as evidence.
      - name: Execute tests
        run: vendor/bin/pest --ci --parallel

  # The MySQL run of the suite, on PRs into main (release PRs) and on pushes
  # to main. Locally the same run is `composer test:mysql`.
  test-mysql:
    name: Test (MySQL)
    needs: changes
    if: >-
      needs.changes.outputs.php == 'true' &&
      (github.base_ref == 'main' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    # root: Laravel's parallel testing creates one testing_test_N database per worker.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: Constrain Testbench
        run: composer require "orchestra/testbench:^11.0" --dev --no-interaction --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Execute tests
        run: composer test:mysql -- --ci

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # setup-bun caches only the bun binary, not the packages.
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

  node:
    name: Node
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # @tbtop/admin is not published yet: build it from DiVotek/tbtop at ADMIN_SHA.
      - name: Build @tbtop/admin
        run: ./scripts/fetch-admin.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

  # The Node package's suite on the two servers the PHP package supports;
  # every test gets its own database (test/support.ts).
  node-db:
    name: Node (${{ matrix.db }})
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mysql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TBTOP_TEST_DB: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Build @tbtop/admin
        run: ./scripts/fetch-admin.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  node-e2e:
    name: Node E2E
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # vite preview and better-sqlite3 run on Node.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build @tbtop/admin
        run: ./scripts/fetch-admin.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The workbench installs both packages from tarballs, as a host would.
      # A fresh pack has a new hash, so `setup` packs and then runs
      # `bun update` on the two tarballs; the other dependencies stay locked.
      - name: Pack @tbtop/cms and @tbtop/admin, install the workbench
        working-directory: packages/node/workbench
        run: bun run setup

      - name: Type check the workbench
        working-directory: packages/node/workbench
        run: bun run typecheck

      - name: Install Chromium
        working-directory: packages/node/workbench
        run: bunx playwright install --with-deps chromium

      - name: E2E (TanStack Start host)
        working-directory: packages/node/workbench
        run: bun run e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-e2e-traces
          path: packages/node/workbench/test-results
          retention-days: 7

  # The one required check: fails when any job failed or was cancelled,
  # passes when the rest passed or skipped. A new job goes into `needs`.
  ci-ok:
    name: CI ok
    needs: [changes, commits, actionlint, lint, analyse, blocks-types, test, test-mysql, frontend, node, node-db, node-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
